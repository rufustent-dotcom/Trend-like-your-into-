<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Vault Agent</title>
    <meta name="description" content="Operational market intelligence engine, research vault, and agentic execution service for the global AI customer service and enterprise automation ecosystem." />
    <meta property="og:title" content="Apex Vault Agent" />
    <meta property="og:description" content="Operational market intelligence engine, research vault, and agentic execution service for the global AI customer service and enterprise automation ecosystem." />
    <script>
      // Runtime constraint: HMR is disabled in AI Studio iframe environment.
      // Gracefully prevent unhandled WebSocket module runner transport errors from polluting console.
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || e.message.includes('connection refused'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        const text = (e?.reason?.message || String(e?.reason || ''));
        if (text.includes('WebSocket') || text.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-zinc-950 text-slate-100 antialiased selection:bg-[#00f5d4]/20 selection:text-[#00f5d4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
